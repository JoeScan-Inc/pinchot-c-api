[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joescan-pinchot"
version = "16.3.2"
description = "Python wrapper for the JoeScan Pinchot C API (JS-50 scan heads)"
readme = "README.md"
requires-python = ">=3.7"
license = "BSD-3-Clause"
authors = [{ name = "JoeScan" }]
keywords = ["joescan", "pinchot", "js-50", "scanning", "lidar", "profile"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://joescan.com"
Documentation = "http://api.joescan.com/doc/v16/"

[tool.setuptools]
packages = ["joescan_pinchot"]

[tool.setuptools.package-data]
# Bundle the native library (and header) when present next to the package.
joescan_pinchot = ["lib/*.dll", "lib/*.so", "lib/*.dylib", "lib/*.h"]
